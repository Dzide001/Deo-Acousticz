name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# ─── Concurrency ─────────────────────────────────────────────────────────────
# Cancel in-progress runs on the same branch to avoid queue build-up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: C++ unit tests — desktop build (macOS, no NDK, no GPU required)
  # ═══════════════════════════════════════════════════════════════════════════
  cpp_tests:
    name: C++ Unit Tests (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S engine \
                -B build/engine \
                -DCMAKE_BUILD_TYPE=Debug \
                -G "Unix Makefiles"
        working-directory: ${{ github.workspace }}

      - name: Build
        run: cmake --build build/engine --parallel 4
        working-directory: ${{ github.workspace }}

      - name: Run tests
        run: |
          cd build/engine/tests
          ./dac_tests --gtest_output=xml:test_results.xml
        working-directory: ${{ github.workspace }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-test-results
          path: build/engine/tests/test_results.xml

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Android APK build (arm64-v8a only for CI speed)
  # ═══════════════════════════════════════════════════════════════════════════
  android_build:
    name: Android Debug APK Build
    runs-on: ubuntu-latest
    needs: cpp_tests  # Only build APK if C++ tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27
        run: |
          sdkmanager "ndk;27.0.12077973"
          sdkmanager "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ github.workspace }}/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droidacoustic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Print APK size
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk")
          echo "APK size: $(du -sh $APK | cut -f1)"
