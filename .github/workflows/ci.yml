name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# ─── Concurrency ─────────────────────────────────────────────────────────────
# Cancel in-progress runs on the same branch to avoid queue build-up
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # Job 1: C++ unit tests — desktop build (macOS, no NDK, no GPU required)
  # ═══════════════════════════════════════════════════════════════════════════
  cpp_tests:
    name: C++ Unit Tests (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -S engine \
                -B build/engine \
                -DCMAKE_BUILD_TYPE=Debug \
                -G "Unix Makefiles"
        working-directory: ${{ github.workspace }}

      - name: Build
        run: cmake --build build/engine --parallel 4
        working-directory: ${{ github.workspace }}

      - name: Run tests
        run: |
          cd build/engine/tests
          ./dac_tests --gtest_output=xml:test_results.xml
        working-directory: ${{ github.workspace }}

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpp-test-results
          path: build/engine/tests/test_results.xml

  # ═══════════════════════════════════════════════════════════════════════════
  # Job 2: Android APK build (arm64-v8a only for CI speed)
  # ═══════════════════════════════════════════════════════════════════════════
  android_build:
    name: Android Debug APK Build
    runs-on: ubuntu-latest
    needs: cpp_tests  # Only build APK if C++ tests pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27
        run: |
          sdkmanager "ndk;27.0.12077973"
          sdkmanager "cmake;3.22.1"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check independent numerical references
        run: |
          python3 validation/numerical/reference.py --check
          python3 validation/engine-capture/reference.py --check
          python3 validation/relative-response/reference.py --check
          python3 validation/broadband-capture/reference.py --check
          python3 validation/relative-broadband/reference.py --check
          python3 validation/source-spectrum/reference.py --check
        working-directory: ${{ github.workspace }}

      - name: Check public calibrated-measurement reference preparation
        run: |
          python3 -m venv /tmp/acoustic-measurement-tools
          /tmp/acoustic-measurement-tools/bin/python -m pip install -r validation/public-measurements/requirements.txt
          /tmp/acoustic-measurement-tools/bin/python validation/public-measurements/prepare.py --check
        working-directory: ${{ github.workspace }}

      - name: Test comparison CSV packaging
        run: python3 validation/comparison-import/test_package_csv.py
        working-directory: ${{ github.workspace }}

      - name: Run Kotlin unit tests
        run: ./gradlew :shared-core:jvmTest :app:testDebugUnitTest --stacktrace
        working-directory: ${{ github.workspace }}/android

      - name: Upload Kotlin test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-test-results
          path: |
            android/app/build/test-results/testDebugUnitTest/*.xml
            android/shared-core/build/test-results/jvmTest/*.xml
            android/shared-core/build/reports/numerical-validation/engine-jvm.json
            android/shared-core/build/reports/comparison-import/results.json
            android/shared-core/build/reports/engine-capture/results.json
            android/shared-core/build/reports/relative-response/results.json
            android/shared-core/build/reports/broadband-capture/results.json
            android/shared-core/build/reports/relative-broadband/results.json
            android/shared-core/build/reports/source-spectrum/results.json
            android/shared-core/build/reports/validation-workflow/results.json
            android/shared-core/build/reports/public-measurements/results.json
            android/shared-core/build/reports/angular-support/results.json
            android/shared-core/build/reports/angular-domains/results.json
            android/shared-core/build/reports/receiver-angular-support/results.json
            android/shared-core/build/reports/receiver-markers/results.json
            android/shared-core/build/reports/receiver-framing/results.json
            android/app/build/reports/speaker-data/*.json

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace
        working-directory: ${{ github.workspace }}/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: droidacoustic-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Print APK size
        run: |
          APK=$(find android/app/build/outputs/apk/debug -name "*.apk")
          echo "APK size: $(du -sh $APK | cut -f1)"
